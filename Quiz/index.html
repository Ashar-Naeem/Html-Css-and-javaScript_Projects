<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Knowledge Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>General Knowledge Quiz</h1>

    <form id="quizForm">

        <!-- Question 1 -->
        <div class="question">
            <p>1. What is the capital of Pakistan?</p>

            <label>
                <input type="radio" name="q1" value="Karachi"> Karachi
            </label><br>

            <label>
                <input type="radio" name="q1" value="Islamabad"> Islamabad
            </label><br>

            <label>
                <input type="radio" name="q1" value="Lahore"> Lahore
            </label><br>

            <label>
                <input type="radio" name="q1" value="Peshawar"> Peshawar
            </label>
        </div>

        <!-- Question 2 -->
        <div class="question">
            <p>2. Which planet is known as the Red Planet?</p>

            <label>
                <input type="radio" name="q2" value="Earth"> Earth
            </label><br>

            <label>
                <input type="radio" name="q2" value="Mars"> Mars
            </label><br>

            <label>
                <input type="radio" name="q2" value="Venus"> Venus
            </label><br>

            <label>
                <input type="radio" name="q2" value="Jupiter"> Jupiter
            </label>
        </div>

        <!-- Question 3 -->
        <div class="question">
            <p>3. Who invented the light bulb?</p>

            <label>
                <input type="radio" name="q3" value="Thomas Edison"> Thomas Edison
            </label><br>

            <label>
                <input type="radio" name="q3" value="Albert Einstein"> Albert Einstein
            </label><br>

            <label>
                <input type="radio" name="q3" value="Isaac Newton"> Isaac Newton
            </label><br>

            <label>
                <input type="radio" name="q3" value="Nikola Tesla"> Nikola Tesla
            </label>
        </div>

        <!-- Question 4 -->
        <div class="question">
            <p>4. Which is the largest ocean in the world?</p>

            <label>
                <input type="radio" name="q4" value="Atlantic"> Atlantic Ocean
            </label><br>

            <label>
                <input type="radio" name="q4" value="Indian"> Indian Ocean
            </label><br>

            <label>
                <input type="radio" name="q4" value="Pacific Ocean"> Pacific Ocean
            </label><br>

            <label>
                <input type="radio" name="q4" value="Arctic"> Arctic Ocean
            </label>
        </div>

        <!-- Question 5 -->
        <div class="question">
            <p>5. Which is the fastest land animal?</p>

            <label>
                <input type="radio" name="q5" value="Lion"> Lion
            </label><br>

            <label>
                <input type="radio" name="q5" value="Tiger"> Tiger
            </label><br>

            <label>
                <input type="radio" name="q5" value="Horse"> Horse
            </label><br>

            <label>
                <input type="radio" name="q5" value="Cheetah"> Cheetah
            </label>
        </div>

        <button type="submit">Submit Quiz</button>

        <div id="result">

        </div>

    </form>
</div>
    <script src="./script.js"></script>
</body>
</html>
